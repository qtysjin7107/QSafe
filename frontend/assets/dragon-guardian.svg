<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Stylized celestial dragon guardian">
  <defs>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17382f"/>
      <stop offset="0.48" stop-color="#2f6b51"/>
      <stop offset="1" stop-color="#10251f"/>
    </linearGradient>
    <linearGradient id="scarlet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e2528"/>
      <stop offset="1" stop-color="#3a1015"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dc88"/>
      <stop offset="0.55" stop-color="#d5ad4d"/>
      <stop offset="1" stop-color="#8e6426"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scales" width="22" height="18" patternUnits="userSpaceOnUse">
      <path d="M1 9 Q11 0 21 9 Q11 18 1 9Z" fill="none" stroke="#e6c96c" stroke-width="1.1" opacity=".28"/>
    </pattern>
  </defs>

